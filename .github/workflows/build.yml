name: build

on:
  push:
  workflow_dispatch:

# a new push cancels the run of the previous one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  results:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Every verdict and figure, recomputed from results/raw
        run: nix build -L
      - name: Tests in the development shell
        timeout-minutes: 20
        shell: bash
        # a test that hangs prints its stack after five minutes
        run: |
          nix develop --command pytest -v -o faulthandler_timeout=300 tests 2>&1 | tee pytest.log
          exit ${PIPESTATUS[0]}
      - name: The end of a failed test run, as an annotation
        if: failure()
        shell: bash
        run: echo "::error title=pytest::$(tail -n 60 pytest.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
      - run: mkdir out && cp result/verdicts.txt result/numbers.json out/
      - uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.os }}
          path: out

  same-results:
    needs: results
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
      - name: Linux and macOS give the same verdicts and numbers
        run: |
          diff results-ubuntu-24.04/verdicts.txt results-macos-15/verdicts.txt
          diff results-ubuntu-24.04/numbers.json results-macos-15/numbers.json

  firmware-shells:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: STM32 toolchain, CMSIS and libopencm3
        run: nix develop ./mcu/stm32 --command arm-none-eabi-gcc --version
      - name: ESP-IDF
        run: nix develop ./mcu/esp32 --command idf.py --version
